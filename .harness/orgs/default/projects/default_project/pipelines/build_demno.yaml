pipeline:
  stages:
    - steps:
        - run:
            script: echo "hello world"
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
            with:
              version: "17"
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              export JAVA_HOME=/opt/harness/tools/java/current
              export PATH=$JAVA_HOME/bin:$PATH
              java -version
              cd ci-activation-app
              mvn -B -DskipTests -Dmaven.build.cache.skipCache=true package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              set -eu
              export JAVA_HOME=/opt/harness/tools/java/current
              export PATH=$JAVA_HOME/bin:$PATH
              cd ci-activation-app
              mvn -B test -Dmaven.build.cache.skipCache=true
              mvn -B jacoco:report || echo "JaCoCo is not configured; skipping coverage report generation."
            intelligence:
              disabled: true
